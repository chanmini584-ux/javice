<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<style>
  :root {
    --bg: #0b1220; --side: #0f1729; --panel: #131d33; --line: #22304d; --text: #e6edf7; --muted: #8a9bb8;
    --accent: #4cc3ff; --accent-ink: #04121c; --me: #1d3b5c; --err: #ff6b6b; --code: #0a1020;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f9fc; --side: #eef2f8; --panel: #ffffff; --line: #d8e0ec; --text: #142033; --muted: #5d6b82;
            --accent: #0a7bc2; --accent-ink: #ffffff; --me: #dcecfb; --err: #c62828; --code: #f1f4f9; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { display: flex; height: 100dvh; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* sidebar */
  aside { width: 272px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 10px 10px; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
  .brand img { width: 28px; height: 28px; }
  .brand b { letter-spacing: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-left: auto; }
  .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  .newchat { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); text-align: left; }
  .list { flex: 1; overflow: auto; margin: 4px -4px; padding: 0 4px; }
  .list h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 8px 4px; }
  .item { display: flex; align-items: center; border-radius: 8px; }
  .item button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .item:hover, .item.active { background: var(--panel); }
  .item .del { visibility: hidden; background: none; border: 0; color: var(--muted); padding: 6px 8px; }
  .item:hover .del, .item.active .del { visibility: visible; }
  .links { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; }
  .links button { background: none; border: 0; text-align: left; padding: 8px 10px; border-radius: 8px; }
  .links button:hover, .links button.active { background: var(--panel); }

  /* main column */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header.top { display: none; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    border-bottom: 1px solid var(--line); }
  header.top .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    font-size: 18px; flex: none; display: grid; place-items: center; }
  #scroll { flex: 1; overflow: auto; }
  .view { display: none; max-width: 780px; margin: 0 auto; padding: 20px 16px 8px; }
  .view.active { display: block; }

  /* messages */
  .msg { margin: 18px 0; display: flex; gap: 12px; }
  .msg.me { justify-content: flex-end; }
  .msg.me .bubble { background: var(--me); border-radius: 18px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
  .msg.ai .avatar { width: 30px; height: 30px; flex: none; margin-top: 2px; }
  .msg.ai .body { flex: 1; min-width: 0; }
  .msg.ai .body > :first-child { margin-top: 0; }
  .msg.err .body { color: var(--err); }
  .body p { margin: 0 0 12px; }
  .body h1, .body h2, .body h3 { font-size: 1.1em; margin: 16px 0 8px; }
  .body ul, .body ol { margin: 0 0 12px; padding-left: 22px; }
  .body blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .body code { background: var(--code); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 0.9em;
    font-family: ui-monospace, "SF Mono", Consolas, "D2Coding", monospace; }
  .body pre { position: relative; background: var(--code); border: 1px solid var(--line); border-radius: 10px;
    padding: 30px 14px 12px; overflow: auto; margin: 0 0 12px; }
  .body pre code { border: 0; padding: 0; background: none; font-size: 14px; }
  .body pre .lang { position: absolute; top: 6px; left: 12px; font-size: 12px; color: var(--muted); }
  .body pre .copy { position: absolute; top: 4px; right: 6px; font-size: 12px; background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 8px; color: var(--muted); }
  .body a { color: var(--accent); }
  .body table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow: auto; }
  .body th, .body td { border: 1px solid var(--line); padding: 4px 10px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
  .actions { display: flex; gap: 4px; margin-top: -4px; }
  .actions button { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  .actions button:hover { background: var(--panel); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  .cursor { display: inline; }

  /* welcome */
  .welcome { text-align: center; padding-top: 12vh; }
  .welcome img { width: 64px; height: 64px; }
  .welcome h2 { margin: 12px 0 4px; font-weight: 600; }
  .suggest { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 28px; text-align: left; }
  .suggest button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .suggest button b { display: block; font-size: 15px; }
  .suggest button span { color: var(--muted); }

  /* composer */
  footer { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .composer { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px; }
  textarea { width: 100%; resize: none; border: 0; outline: none; background: none; color: var(--text); font: inherit;
    min-height: 28px; max-height: 200px; padding: 4px 8px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .toggle { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; background: none; }
  .toggle.on { color: var(--accent); border-color: var(--accent); }
  .row .grow { flex: 1; }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 16px; }
  .send:disabled { opacity: .4; cursor: default; }
  .mic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: none; }
  .mic.live { background: var(--err); color: #fff; border-color: var(--err); }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  .done { text-decoration: line-through; color: var(--muted); }
  #login input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 16px; margin-top: 10px; }

  .scrim { display: none; }
  @media (max-width: 820px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; }
    body.drawer aside { transform: none; }
    body.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); }
    header.top { display: flex; }
    .suggest { grid-template-columns: 1fr; }
    .welcome { padding-top: 6vh; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/icon.svg" alt=""><b>JARVIS</b><span class="dot" id="dot" title="서버 연결"></span></div>
  <button class="newchat" id="newChat">＋ 새 대화</button>
  <div class="list" id="chatList"></div>
  <div class="links">
    <button data-view="goals">🎯 목표와 계획</button>
    <button data-view="memos">📝 메모</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="top">
    <button class="iconbtn" id="menu" aria-label="대화 목록">☰</button>
    <div class="title" id="title">JARVIS</div>
    <button class="iconbtn" id="newChatTop" aria-label="새 대화">＋</button>
  </header>
  <div id="scroll">
    <section id="chat" class="view active"><div id="log"></div></section>
    <section id="goals" class="view"></section>
    <section id="memos" class="view"></section>
    <section id="login" class="view">
      <div class="card">
        <h3>접속 토큰</h3>
        <p class="muted">JARVIS를 실행한 PC 화면에 표시된 주소로 접속하거나, 토큰을 붙여넣으세요.</p>
        <input id="tokenInput" placeholder="토큰" autocomplete="off">
        <button class="primary" id="saveToken">저장</button>
      </div>
    </section>
  </div>
  <footer id="composer">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="자비스에게 메시지 보내기"></textarea>
      <div class="row">
        <button class="mic" id="mic" title="말로 입력">🎤</button>
        <button class="toggle" id="memoMode" title="대화 대신 메모로 저장합니다">📝 메모</button>
        <button class="toggle" id="speak" title="답변을 소리로 읽어 줍니다">🔊 읽어주기</button>
        <span class="grow"></span>
        <button class="send" id="send" title="보내기 (Enter)" disabled>↑</button>
      </div>
    </div>
    <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈</div>
  </footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// Token: taken once from the #token=... link printed by `jarvis serve`, then remembered.
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("token")) { store.set("jarvis.token", hash.get("token")); history.replaceState(null, "", "/"); }
let token = store.get("jarvis.token", "");
let chatId = null;
let busy = false;

function headers(json) {
  return { "Authorization": "Bearer " + token, ...(json ? { "Content-Type": "application/json" } : {}) };
}
async function api(path, body, method) {
  const res = await fetch(path, { method: method || (body ? "POST" : "GET"), headers: headers(!!body),
                                  body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { show("login"); throw new Error("토큰이 맞지 않습니다"); }
  if (!res.ok) throw new Error("서버 오류 " + res.status);
  return res.json();
}

// ---------- markdown (escaped first, so model output can never inject HTML) ----------
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function blocks(text) {
  const lines = text.split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { const n = Math.min(m[1].length + 1, 3); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1])) {
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = "<table><tr>" + cells(line).map(c => `<th>${c}</th>`).join("") + "</tr>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += "<tr>" + cells(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out.push(html + "</table>"); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "")); i++; }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map(t => `<li>${inline(t)}</li>`).join("") + `</${tag}>`); continue;
    }
    if (/^>\s?/.test(line)) {
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
      out.push(`<blockquote>${inline(q.join("\n")).replace(/\n/g, "<br>")}</blockquote>`); continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i])) { para.push(lines[i]); i++; }
    if (!para.length) { para.push(line); i++; }
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}
function markdown(src) {
  let html = "", last = 0;
  const fence = /```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(?:```|$)/g;  // an unclosed fence (still streaming) runs to the end
  for (let m; (m = fence.exec(src)); ) {
    if (m[0] === "") { fence.lastIndex++; continue; }
    html += blocks(src.slice(last, m.index));
    html += `<pre>${m[1] ? `<span class="lang">${esc(m[1])}</span>` : ""}<button class="copy">복사</button><code>${esc(m[2].replace(/\n$/, ""))}</code></pre>`;
    last = fence.lastIndex;
  }
  return html + blocks(src.slice(last));
}
document.addEventListener("click", (e) => {
  if (!e.target.classList.contains("copy")) return;
  navigator.clipboard?.writeText(e.target.parentElement.querySelector("code").textContent);
  e.target.textContent = "복사됨"; setTimeout(() => (e.target.textContent = "복사"), 1200);
});

// ---------- views ----------
function show(view) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === view));
  document.querySelectorAll(".links button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  $("composer").style.display = view === "chat" ? "" : "none";
  document.body.classList.remove("drawer");
  if (view === "goals" || view === "memos") { $("title").textContent = view === "goals" ? "목표와 계획" : "메모"; loadOverview(); }
  if (view === "chat") renderList();
}
document.querySelectorAll(".links button").forEach(b => b.onclick = () => show(b.dataset.view));
$("menu").onclick = () => document.body.classList.add("drawer");
$("scrim").onclick = () => document.body.classList.remove("drawer");
$("saveToken").onclick = () => { token = $("tokenInput").value.trim(); store.set("jarvis.token", token); show("chat"); ping(); loadChats(); };

const scroller = $("scroll");
function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function toBottom() { scroller.scrollTop = scroller.scrollHeight; }

// ---------- messages ----------
function addMe(text) {
  const row = el("div", "msg me"); row.appendChild(el("div", "bubble", text)); $("log").appendChild(row); return row;
}
function addAi() {
  const row = el("div", "msg ai");
  const av = el("img", "avatar"); av.src = "/icon.svg"; av.alt = "";
  const body = el("div", "body");
  const tools = el("div", "tools"); tools.style.display = "none";
  const content = el("div", "content");
  const actions = el("div", "actions");
  body.append(tools, content, actions); row.append(av, body); $("log").appendChild(row);
  let raw = "";
  return {
    row,
    typing() { content.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; },
    tool(name) { tools.style.display = ""; tools.appendChild(el("span", "chip", TOOL_LABELS[name] || name)); },
    append(t) {
      raw += t; content.innerHTML = markdown(raw);
      let node = content;  // put the typing cursor at the end of the last line, not on a line of its own
      while (node.lastElementChild && node.lastElementChild.tagName !== "BUTTON") node = node.lastElementChild;
      node.appendChild(el("span", "cursor"));
    },
    finish(text) {
      raw = text ?? raw; content.innerHTML = markdown(raw);
      const copy = el("button", null, "복사"); copy.onclick = () => navigator.clipboard?.writeText(raw);
      const listen = el("button", null, "듣기"); listen.onclick = () => say(raw, true);
      actions.replaceChildren(copy, ...("speechSynthesis" in window ? [listen] : []));
    },
    fail(msg) { row.classList.add("err"); content.textContent = msg; },
  };
}
const TOOL_LABELS = {
  web_search: "🔍 웹 검색", search_knowledge: "📚 지식 검색", recall: "🧠 기억 찾기", remember: "🧠 기억 저장",
  forget: "🧠 기억 삭제", update_profile: "👤 프로필 갱신", search_memos: "📝 메모 찾기", add_goal: "🎯 목표 추가",
  list_goals: "🎯 목표 확인", save_plan: "🗺️ 계획 저장", update_status: "✅ 진행 갱신", calculate: "🧮 계산",
  run_python: "🐍 코드 실행", look: "👁️ 카메라 보기",
};

function say(text, force) {
  if ((!force && !$("speak").classList.contains("on")) || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, " 코드 생략 ").replace(/[#*`>|]/g, ""));
  u.lang = "ko-KR"; speechSynthesis.speak(u);
}

function welcome() {
  const w = el("div", "welcome");
  const img = el("img"); img.src = "/icon.svg"; img.alt = "";
  w.append(img, el("h2", null, "무엇을 도와드릴까요?"), el("div", "muted", "대화 내용은 이 PC의 JARVIS에 저장되고, 어느 기기에서든 이어서 볼 수 있습니다."));
  const grid = el("div", "suggest");
  for (const [title, sub, prompt] of [
    ["오늘 할 일 정리", "목표와 메모를 보고 우선순위", "내 목표와 최근 메모를 보고 오늘 할 일을 우선순위대로 정리해줘."],
    ["새 소식 요약", "수집된 IT·수학·기계공학 자료", "최근 수집된 자료 중에서 내가 볼 만한 걸 골라 요약해줘."],
    ["계획 세우기", "목표를 단계별 계획으로", "새 목표를 세우고 싶어. 질문하면서 단계별 계획을 같이 만들어줘."],
    ["정확한 계산", "수식·단위 계산", "M8 볼트(피치 1.25)의 응력 단면적과 8.8 등급 허용 인장하중을 계산해줘."],
  ]) {
    const b = el("button"); b.append(el("b", null, title), el("span", null, sub));
    b.onclick = () => { $("input").value = prompt; autosize(); send(); };
    grid.appendChild(b);
  }
  w.appendChild(grid);
  $("log").replaceChildren(w);
}

// ---------- chat list ----------
let chats = [];
function group(iso) {
  const d = new Date(iso), now = new Date(), day = 864e5;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (d >= start) return "오늘";
  if (d >= start - day) return "어제";
  if (d >= start - 6 * day) return "지난 7일";
  return "이전";
}
function renderList() {
  const list = $("chatList"); list.replaceChildren();
  let current = null;
  for (const c of chats) {
    const g = group(c.updated_at);
    if (g !== current) { list.appendChild(el("h4", null, g)); current = g; }
    const item = el("div", "item" + (c.id === chatId && $("chat").classList.contains("active") ? " active" : ""));
    const open = el("button", "open", c.title); open.title = c.title; open.onclick = () => openChat(c.id);
    const del = el("button", "del", "🗑"); del.title = "삭제";
    del.onclick = async () => {
      if (!confirm(`"${c.title}" 대화를 삭제할까요?`)) return;
      await api(`/api/chats/${c.id}`, null, "DELETE");
      if (chatId === c.id) newChat();
      loadChats();
    };
    item.append(open, del); list.appendChild(item);
  }
  const t = chats.find(c => c.id === chatId);
  if ($("chat").classList.contains("active")) $("title").textContent = t ? t.title : "새 대화";
}
async function loadChats() { try { chats = await api("/api/chats"); renderList(); } catch {} }
async function openChat(id) {
  chatId = id; store.set("jarvis.chat", String(id)); show("chat");
  try {
    const msgs = await api(`/api/chats/${id}`);
    $("log").replaceChildren();
    for (const m of msgs) {
      if (m.role === "user") addMe(m.text);
      else { const a = addAi(); m.tools.forEach(t => a.tool(t)); a.finish(m.text); }
    }
    toBottom();
  } catch { newChat(); }
}
function newChat() { chatId = null; store.set("jarvis.chat", ""); show("chat"); welcome(); $("input").focus(); }
$("newChat").onclick = newChat; $("newChatTop").onclick = newChat;

// ---------- sending ----------
async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = ""; autosize();
  if ($("log").querySelector(".welcome")) $("log").replaceChildren();
  addMe(text); toBottom();
  busy = true; $("send").disabled = true;
  if ($("memoMode").classList.contains("on")) {
    const a = addAi();
    try { const r = await api("/api/memo", { text }); a.finish(r.new ? "메모했습니다. 나중에 중요도를 판단해 정리할게요." : "전에도 하신 얘기네요. 중요도를 올려 둘게요."); }
    catch (e) { a.fail(e.message); }
    busy = false; updateSend(); return;
  }
  const a = addAi(); a.typing(); toBottom();
  let got = false;
  try {
    const res = await fetch("/api/chat/stream", { method: "POST", headers: headers(true), body: JSON.stringify({ message: text, chat_id: chatId }) });
    if (res.status === 401) { show("login"); throw new Error("토큰이 맞지 않습니다"); }
    if (!res.ok || !res.body) throw new Error("서버 오류 " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", finished = false;
    while (!finished) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const kind = (frame.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((frame.match(/^data: (.*)$/m) || [, "{}"])[1]);
        const stick = nearBottom();
        if (kind === "chat") { if (chatId !== data.chat_id) { chatId = data.chat_id; store.set("jarvis.chat", String(chatId)); } }
        else if (kind === "text") { got = true; a.append(data.text); }
        else if (kind === "tool") { a.tool(data.name); if (!got) a.typing(); }
        else if (kind === "done") { a.finish(data.text); say(data.text); finished = true; }
        else if (kind === "error") { a.fail("오류: " + data.message); finished = true; }
        if (stick) toBottom();
      }
    }
    if (!finished) a.fail("연결이 끊겼습니다. 다시 시도해 주세요.");
  } catch (e) { a.fail(e.message); }
  busy = false; updateSend(); loadChats();
}
function updateSend() { $("send").disabled = busy || !$("input").value.trim(); }
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; updateSend(); }
$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", autosize);
for (const id of ["memoMode", "speak"]) {
  if (store.get("jarvis." + id) === "1") $(id).classList.add("on");
  $(id).onclick = () => { const on = $(id).classList.toggle("on"); store.set("jarvis." + id, on ? "1" : "0");
    if (id === "memoMode") $("input").placeholder = on ? "메모할 내용 (자비스가 나중에 중요도를 판단합니다)" : "자비스에게 메시지 보내기"; };
}
if ($("memoMode").classList.contains("on")) $("input").placeholder = "메모할 내용 (자비스가 나중에 중요도를 판단합니다)";

// Voice input through the browser's own speech recognition (Chrome, Edge, Safari).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $("mic").style.display = "none";
let rec = null;
$("mic").onclick = () => {
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
  $("mic").classList.add("live");
  rec.onresult = (e) => { $("input").value = Array.from(e.results).map(r => r[0].transcript).join(""); autosize(); };
  rec.onend = () => { $("mic").classList.remove("live"); rec = null; if ($("input").value.trim()) send(); };
  rec.onerror = () => { $("mic").classList.remove("live"); rec = null; };
  rec.start();
};

// ---------- goals & memos ----------
async function loadOverview() {
  try {
    const o = await api("/api/overview");
    const g = $("goals"); g.replaceChildren(el("h2", null, "목표와 계획"));
    if (!o.goals.length) g.appendChild(el("p", "muted", "진행 중인 목표가 없습니다. 대화에서 목표를 말해 보세요."));
    for (const goal of o.goals) {
      const c = el("div", "card");
      c.appendChild(el("h3", null, goal.title + (goal.deadline ? `  · ~${goal.deadline}` : "")));
      if (goal.why) c.appendChild(el("div", "muted", goal.why));
      const ol = el("ol");
      for (const s of goal.plan) ol.appendChild(el("li", s.status === "done" ? "done" : "", s.description + (s.status !== "todo" && s.status !== "done" ? ` (${s.status})` : "")));
      c.appendChild(ol); g.appendChild(c);
    }
    const m = $("memos"); m.replaceChildren(el("h2", null, "메모"));
    if (!o.memos.length) m.appendChild(el("p", "muted", "아직 메모가 없습니다."));
    for (const memo of o.memos) {
      const c = el("div", "card");
      c.appendChild(el("div", null, memo.text));
      const imp = memo.importance == null ? "판단 대기" : "중요도 " + memo.importance;
      const src = { voice: "음성", app: "앱" }[memo.source] || memo.source;
      c.appendChild(el("div", "muted", `${imp} · ${memo.mentions}회 언급 · ${src} · ${new Date(memo.last_seen_at).toLocaleString("ko-KR")}`));
      m.appendChild(c);
    }
  } catch { /* login view already shown on 401 */ }
}

async function ping() {
  try { const r = await fetch("/api/health"); $("dot").classList.toggle("on", r.ok); }
  catch { $("dot").classList.remove("on"); }
}

if (!token) show("login");
else {
  const last = Number(store.get("jarvis.chat", "")) || null;
  if (last) openChat(last); else welcome();
  loadChats();
}
ping(); setInterval(ping, 30000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
