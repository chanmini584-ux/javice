name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[web,desktop,dev]" pyinstaller pyyaml
      - name: Tests
        run: python -m pytest -q
      - name: Build JARVIS.exe and the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup
          path: dist-installer/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
