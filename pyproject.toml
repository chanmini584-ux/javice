[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS-style personal AI agent built on the Claude API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
